alerts:
  - name: HighChatLatency
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: Bùi Tùng Lâm
    runbook: docs/alerts.md#alert-1
  - name: ElevatedChatErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: Bùi Tùng Lâm
    runbook: docs/alerts.md#alert-2
  - name: DailyCostBudgetExceeded
    severity: warning
    condition: daily_cost_usd > 2.5
    type: symptom-based
    owner: Bùi Tùng Lâm
    runbook: docs/alerts.md#alert-3
